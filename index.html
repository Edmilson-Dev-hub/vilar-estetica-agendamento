<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Teste scroll</title>
  <style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  .section {
    position: sticky;
    top: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: clamp(24px, 5vw, 80px);
    border-radius: 40px 40px 0 0;
  }
  .section h2 {
    font-size: clamp(1.8rem, 5vw, 3rem);
    margin-bottom: 16px;
  }
  .section p {
    font-size: clamp(1.125rem, 2.5vw, 1.5rem);
  }
  .s1 {
    background: #f5efe6;
    color: #2a1a12;
    z-index: 1;
  }
  .s2 {
    background: #ffffff;
    color: #2a1a12;
    z-index: 2;
  }
  .s3 {
    background: #b8794f;
    color: #ffffff;
    z-index: 3;
  }
  .s4 {
    background: #2a1a12;
    color: #f5efe6;
    z-index: 4;
  }
</style>
</head>
<body>
    <div class="section s1">
      <h2>Seção 1</h2>
      <p>Esse é o conteúdo da primeira seção.</p>
    </div>

    <div class="section s2">
      <h2>Seção 2</h2>
      <p>Esse é o conteúdo da segunda seção.</p>
    </div>

    <div class="section s3">
      <h2>Seção 3</h2>
      <p>Esse é o conteúdo da terceira seção.</p>
    </div>

    <div class="section s4">
      <h2>Seção 4</h2>
      <p>Esse é o conteúdo da quarta seção.</p>
    </div>
</body>
</html>
